name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust:
    name: Rust Compilation & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies (WebKit/GTK for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check & Test web-reader
        run: |
          cargo test --manifest-path crates/web-reader/Cargo.toml --verbose

      - name: Check & Test earnest-wf-engine
        run: |
          cd earnest-wf-engine
          cargo test -p wf-core -p wf-mcp --verbose

      - name: Check & Test earnest-core
        run: |
          cd earnest-core
          cargo test --verbose

      - name: Check & Test earnest-ide/core
        run: |
          cd earnest-ide/core
          cargo test --verbose

      - name: Check & Test earnest-bcpe
        run: |
          cd earnest-bcpe
          cargo test --verbose

