[package]
name = "earnest-core"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
chrono = "0.4"
uuid = { version = "1.7", features = ["v4"] }
tiny_http = "0.12"
rust-embed = "8.2"
regex = "1.10"
urlencoding = "2.1"
context-trimmer = { path = "../crates/context-trimmer" }
tool-output-cache = { path = "../crates/tool-output-cache" }
retry-budget = { path = "../crates/retry-budget" }
json-repair = { path = "../crates/json-repair" }
symbol-index = { path = "../crates/symbol-index" }
atomic-patch = { path = "../crates/atomic-patch" }
log-sanitizer = { path = "../crates/log-sanitizer" }
loop-detector = { path = "../crates/loop-detector" }
tool-guard = { path = "../crates/tool-guard" }
token-compactor = { path = "../crates/token-compactor" }
react-resilience = { path = "../crates/react-resilience" }
agent-scheduler = { path = "../crates/agent-scheduler" }
stream-cleaner = { path = "../crates/stream-cleaner" }
wf-core = { path = "../earnest-wf-engine/crates/wf-core" }
chromatix-vault = { path = "../crates/chromatix-vault" }
