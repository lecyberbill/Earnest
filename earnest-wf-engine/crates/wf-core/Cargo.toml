[package]
name = "wf-core"
version = "0.1.0"
edition = "2021"
description = "WFL (Workflow Language) AST, YAML parser, JSON schema generator and semantic validator"

[dependencies]
log-sanitizer = { path = "../../../crates/log-sanitizer" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tool-guard = { path = "../../../crates/tool-guard" }
